<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 960" width="480" height="960">
<defs>
  <pattern id="grass" width="24" height="24" patternUnits="userSpaceOnUse">
    <rect width="24" height="24" fill="#7CC55A"/>
    <path d="M4 18l2-6 2 6M14 10l2-6 2 6M9 23l1.5-4 1.5 4M19 20l1.5-4 1.5 4" stroke="#6AB64A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </pattern>
  <pattern id="tall" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect width="20" height="20" fill="#4E9E3C"/>
    <path d="M2 20c2-6 3-10 3-14M8 20c2-5 4-9 6-13M14 20c1-6 2-9 2-13M18 20c1-4 1-7 1-11" stroke="#3B8A2E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M5 20c0-5 1-8 2-11M11 20c1-4 2-7 3-10" stroke="#6CC355" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </pattern>
  <pattern id="dirt" width="30" height="30" patternUnits="userSpaceOnUse">
    <rect width="30" height="30" fill="#D9A866"/>
    <circle cx="7" cy="9" r="2" fill="#C7955A"/><circle cx="22" cy="20" r="2.5" fill="#C7955A"/><circle cx="16" cy="5" r="1.5" fill="#E6BC80"/>
  </pattern>
  <pattern id="soil" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="16" height="16" fill="#A66B3A"/><rect y="7" width="16" height="2" fill="#8E5A30"/>
  </pattern>
</defs>
<!-- base grass -->
<rect width="480" height="960" fill="url(#grass)"/>
<!-- winding dirt path -->
<path d="M-20 320 C120 300 180 380 300 360 S480 300 520 330 L520 410 C420 380 330 450 230 430 S60 400 -20 420 Z" fill="url(#dirt)"/>
<path d="M-20 560 C100 540 170 610 260 600 S430 560 520 590 L520 660 C400 640 320 700 220 680 S80 650 -20 670 Z" fill="url(#dirt)"/>
<path d="M300 360 C330 440 290 520 310 600" stroke="#D9A866" stroke-width="46" fill="none" stroke-linecap="round"/>
<path d="M-20 320 C120 300 180 380 300 360 S480 300 520 330" stroke="#B9875A" stroke-width="2" fill="none" opacity=".5"/>
<!-- tall grass patches -->
<rect x="20" y="40" width="150" height="90" rx="14" fill="url(#tall)"/>
<rect x="330" y="30" width="130" height="110" rx="14" fill="url(#tall)"/>
<rect x="40" y="720" width="190" height="130" rx="14" fill="url(#tall)"/>
<rect x="290" y="760" width="170" height="110" rx="14" fill="url(#tall)"/>
<!-- hedge borders -->
<g fill="#3E8E36" stroke="#2F6F2A" stroke-width="3">
  <rect x="-10" y="440" width="500" height="34" rx="17"/>
  <rect x="-10" y="880" width="500" height="34" rx="17"/>
</g>
<g fill="#5FB24E">
  <circle cx="30" cy="452" r="9"/><circle cx="90" cy="458" r="9"/><circle cx="150" cy="450" r="9"/><circle cx="210" cy="457" r="9"/><circle cx="270" cy="451" r="9"/><circle cx="330" cy="458" r="9"/><circle cx="390" cy="450" r="9"/><circle cx="450" cy="456" r="9"/>
  <circle cx="30" cy="892" r="9"/><circle cx="90" cy="898" r="9"/><circle cx="150" cy="890" r="9"/><circle cx="210" cy="897" r="9"/><circle cx="270" cy="891" r="9"/><circle cx="330" cy="898" r="9"/><circle cx="390" cy="890" r="9"/><circle cx="450" cy="896" r="9"/>
</g>
<!-- round bushes -->
<g>
  <ellipse cx="420" cy="520" rx="46" ry="34" fill="#3E8E36"/><ellipse cx="405" cy="508" rx="30" ry="22" fill="#5FB24E"/><ellipse cx="438" cy="512" rx="22" ry="17" fill="#6CC355"/>
  <ellipse cx="60" cy="640" rx="40" ry="30" fill="#3E8E36"/><ellipse cx="48" cy="630" rx="26" ry="19" fill="#5FB24E"/>
</g>
<!-- garden plot -->
<rect x="340" y="210" width="120" height="70" rx="6" fill="url(#soil)" stroke="#7B4B26" stroke-width="3"/>
<g fill="#F2B233" transform="translate(0,170)"><circle cx="360" cy="60" r="6"/><circle cx="390" cy="60" r="6"/><circle cx="420" cy="60" r="6"/><circle cx="445" cy="60" r="6"/><circle cx="360" cy="90" r="6"/><circle cx="390" cy="90" r="6"/><circle cx="420" cy="90" r="6"/><circle cx="445" cy="90" r="6"/></g>
<!-- small red-roofed building -->
<g transform="translate(0,170)">
  <rect x="40" y="30" width="170" height="80" rx="6" fill="#F3EEE4" stroke="#B9AFA0" stroke-width="3"/>
  <path d="M28 44 L125 -10 L222 44 Z" fill="#E3473A" stroke="#B2362C" stroke-width="3"/>
  <rect x="28" y="40" width="194" height="14" rx="4" fill="#E3473A"/>
  <rect x="105" y="60" width="40" height="50" rx="4" fill="#9ED3F0" stroke="#5CA9D6" stroke-width="3"/>
  <rect x="55" y="62" width="30" height="24" rx="3" fill="#9ED3F0" stroke="#5CA9D6" stroke-width="2"/>
  <rect x="165" y="62" width="30" height="24" rx="3" fill="#9ED3F0" stroke="#5CA9D6" stroke-width="2"/>
  <circle cx="125" cy="22" r="10" fill="#fff" stroke="#B2362C" stroke-width="3"/><path d="M115 22h20" stroke="#B2362C" stroke-width="3"/><circle cx="125" cy="22" r="3" fill="#B2362C"/>
</g>
<!-- lamp post -->
<g transform="translate(0,170)"><rect x="258" y="60" width="6" height="70" fill="#3B3B3B"/><rect x="248" y="48" width="26" height="18" rx="4" fill="#F7D774" stroke="#3B3B3B" stroke-width="3"/><rect x="250" y="128" width="22" height="8" rx="2" fill="#3B3B3B"/></g>
<!-- flowers -->
<g>
  <circle cx="240" cy="330" r="5" fill="#FF6B8A"/><circle cx="252" cy="338" r="5" fill="#FFD166"/><circle cx="232" cy="346" r="5" fill="#FF6B8A"/>
  <circle cx="200" cy="520" r="5" fill="#FFD166"/><circle cx="212" cy="528" r="5" fill="#FF6B8A"/>
  <circle cx="420" cy="700" r="5" fill="#FF6B8A"/><circle cx="432" cy="708" r="5" fill="#FFD166"/><circle cx="412" cy="716" r="5" fill="#FFD166"/>
  <circle cx="110" cy="560" r="5" fill="#FFD166"/><circle cx="122" cy="568" r="5" fill="#FF6B8A"/>
</g>
<!-- signpost -->
<g><rect x="228" y="540" width="6" height="40" fill="#8E5A30"/><rect x="206" y="520" width="50" height="26" rx="4" fill="#6CA6CD" stroke="#3E6F8E" stroke-width="3"/><path d="M214 530h34M214 537h22" stroke="#fff" stroke-width="2"/></g>
</svg>
